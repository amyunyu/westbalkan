            if (!item) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center pointer-events-none">
                    <div
                        className="absolute inset-0 bg-black/40 backdrop-blur-sm pointer-events-auto transition-opacity duration-300"
                        onClick={onClose}
                    />

                    <div className="relative w-full max-w-md h-[85vh] sm:h-[600px] bg-[#FDFCF8] rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden pointer-events-auto flex flex-col transform transition-transform duration-300 ease-out translate-y-0 animate-fade-in">

                        <div className="flex items-center justify-between p-4 border-b border-gray-100 bg-white/80 backdrop-blur-md sticky top-0 z-10">
                            <button
                                onClick={onClose}
                                className="p-2 -ml-2 rounded-full hover:bg-gray-100 transition-colors text-gray-600"
                            >
                                <Icon name="ChevronLeft" size={24} />
                            </button>

                            <h2 className={`text-lg font-serif font-bold ${MORANDI_COLORS.text} truncate flex-1 text-center px-2`}>
                                {item.title}
                            </h2>

                             <div className="w-8"></div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 pt-6">

                            <div className="flex flex-col items-center gap-4 mb-6">
                                <div className="flex items-center gap-2">
                                     <span className={`px-3 py-1 rounded-full text-xs font-medium ${MORANDI_COLORS.primary} text-white`}>
                                        {item.time}
                                    </span>
                                     <span className="text-xs text-gray-400 uppercase tracking-wider bg-gray-100 px-2 py-1 rounded-md">{item.type}</span>
                                </div>
                            </div>

                            <div className="prose prose-sm mb-8">
                                <h3 className={`text-lg font-medium mb-3 ${MORANDI_COLORS.highlight} flex items-center`}>關於此行程</h3>
                                <div className="text-gray-600 leading-relaxed text-justify">
                                    {item.desc}
                                </div>
                            </div>

                            {item.tips && item.tips.length > 0 && (
                                <div className={`p-5 rounded-2xl ${MORANDI_COLORS.accent} bg-opacity-30 mb-8`}>
                                    <h3 className={`text-sm font-bold mb-3 flex items-center gap-2 ${MORANDI_COLORS.text}`}>
                                        <Icon name="Star" size={16} /> 貼心小提醒
                                    </h3>
                                    <ul className="space-y-2">
                                        {item.tips.map((tip, idx) => (
                                            <li key={idx} className="flex items-start gap-2 text-sm text-gray-700">
                                                <span className="mt-1.5 w-1.5 h-1.5 rounded-full bg-gray-400 flex-shrink-0" />
                                                {tip}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const InfoPage = () => {
            return (
                <div className="p-6 pb-32 space-y-6 animate-fade-in">
                    <h2 className={`text-2xl font-serif font-bold ${MORANDI_COLORS.text}`}>旅遊資訊</h2>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="text-gray-400"><Icon name="Plane" size={24}/></div>
                            <h3 className="font-bold text-lg text-gray-700">航班資訊</h3>
                        </div>
                        <div className="space-y-6">
                            <div>
    <h4 className="text-xs font-bold text-[#C78F76] uppercase tracking-widest mb-2 border-b border-gray-50 pb-1">去程 DEPARTURE (5/23)</h4>
    <div className="space-y-3">
        <div className="border-l-2 border-[#8F9E9D] pl-4">
            <p className="font-bold text-gray-800 leading-relaxed">EK367 TPE - DXB</p>
            <p className="text-sm text-gray-500 leading-relaxed">23:05 - 04:35 (+1)</p>
        </div>
        <div className="border-l-2 border-[#D4C4B7] pl-4">
            <p className="font-bold text-gray-800 leading-relaxed">EK2012 DXB - ZAG</p>
            <p className="text-sm text-gray-500 leading-relaxed">08:40 - 13:30</p>
        </div>
    </div>
</div>
<div>
    <h4 className="text-xs font-bold text-[#C78F76] uppercase tracking-widest mb-2 border-b border-gray-50 pb-1">回程 RETURN (6/12)</h4>
    <div className="space-y-3">
        <div className="border-l-2 border-[#8F9E9D] pl-4">
            <p className="font-bold text-gray-800 leading-relaxed">EK2075 DBV - DXB</p>
            <p className="text-sm text-gray-500 leading-relaxed">14:20 - 22:00</p>
        </div>
        <div className="border-l-2 border-[#D4C4B7] pl-4">
            <p className="font-bold text-gray-800 leading-relaxed">EK366 DXB - TPE</p>
            <p className="text-sm text-gray-500 leading-relaxed">03:45 - 16:15</p>
        </div>
    </div>
</div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <div className="flex items-center gap-3 mb-4">
                             <div className="text-gray-400"><Icon name="Info" size={24}/></div>
                            <h3 className="font-bold text-lg text-gray-700">行前清單</h3>
                        </div>
                        <ul className="space-y-3">
                            {['護照 (效期6個月以上)', '歐元現金', '海外旅遊保險證明', '轉接頭 (歐規雙圓孔)', '常用藥品'].map((item, i) => (
                                <li key={i} className="flex items-center gap-3 text-sm text-gray-600">
                                    <div className={`w-4 h-4 rounded border ${MORANDI_COLORS.primary} flex items-center justify-center`}>
                                        <div className={`w-2 h-2 rounded-sm ${MORANDI_COLORS.primary}`} />
                                    </div>
                                    {item}
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState(() => {
    return localStorage.getItem('westBalkans_activeTab') || 'itinerary';
});

const [selectedDateIdx, setSelectedDateIdx] = useState(() => {
    const saved = localStorage.getItem('westBalkans_selectedDateIdx');
    const parsed = saved !== null ? parseInt(saved, 10) : 0;

    if (Number.isNaN(parsed)) return 0;
    if (parsed < 0) return 0;
    if (parsed >= tripDates.length) return 0;

    return parsed;
});

const [viewingItem, setViewingItem] = useState(null); 
const scrollRef = useRef(null);

            const currentDate = tripDates[selectedDateIdx];
            const currentEvents = getDayEvents(currentDate.dayNum);

            useEffect(() => {
                if (scrollRef.current) {
                    const activeEl = scrollRef.current.children[selectedDateIdx];
                    if (activeEl) {
                        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                }
            }, [selectedDateIdx]);
            useEffect(() => {
    localStorage.setItem('westBalkans_activeTab', activeTab);
}, [activeTab]);

useEffect(() => {
    localStorage.setItem('westBalkans_selectedDateIdx', selectedDateIdx.toString());
}, [selectedDateIdx]);

            return (
                <div className={`min-h-screen ${MORANDI_COLORS.bg} font-sans selection:bg-[#D4C4B7] selection:text-white`}>
                    <div className="max-w-md mx-auto bg-[#FDFCF8] h-[100dvh] relative shadow-2xl overflow-hidden flex flex-col">

                        <div className="pt-8 px-6 pb-4 bg-white/50 backdrop-blur-sm sticky top-0 z-10 shrink-0">
                            <h1 className={`text-2xl font-serif font-bold ${MORANDI_COLORS.text} tracking-wide`}>
                                山海之間的巴爾幹
                            </h1>
                            <p className="text-xs text-gray-500 mt-1 tracking-widest uppercase">
                                2026 MAY 24 - JUN 12
                            </p>
                        </div>

                        {activeTab === 'itinerary' ? (
                            <React.Fragment>
                                <div className="border-b border-gray-200 bg-white shadow-sm z-0 shrink-0">
                                    <div
                                        ref={scrollRef}
                                        className="flex overflow-x-auto px-0 hide-scrollbar snap-x overflow-y-hidden"
                                    >
                                        {tripDates.map((d, idx) => {
                                            const isActive = idx === selectedDateIdx;
                                            return (
                                                <button
  key={idx}
  onClick={() => setSelectedDateIdx(idx)}
  className={`snap-center flex-shrink-0 flex flex-col items-center justify-between w-16 h-20 transition-colors duration-200 border-r border-gray-50 last:border-0 py-2 ${
      isActive
          ? `${MORANDI_COLORS.primary} text-white`
          : 'bg-white text-gray-400 hover:bg-gray-50'
  }`}
>
  <span className="text-[10px] font-medium opacity-80 uppercase tracking-wider leading-none">
    {d.weekDay}
  </span>

  <span className="text-lg font-bold leading-none translate-y-1">
  {d.dateObj.getDate()}
</span>

  <div className="h-7 w-full flex items-center justify-center px-0.5">
    <span className="text-[9px] font-medium leading-[1.1] text-center whitespace-pre-line line-clamp-2">
      {d.city}
    </span>
  </div>
</button>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto pb-4 mb-24">

                                    <div className="px-6 space-y-2 mt-4">
                                        {currentEvents.map((item, idx) => {
                                            if (item.type === 'compact') {
  return (
    <div
      key={item.id}
      onClick={() => setViewingItem(item)}
      className="bg-gray-100 rounded-lg p-3 border border-gray-200 flex items-center justify-between mb-2 shadow-sm cursor-pointer hover:bg-gray-50 hover:shadow-md transition-all duration-200"
    >
      <div className="flex items-center gap-3">
        <div className={`text-xs font-bold font-serif ${MORANDI_COLORS.highlight} w-12 text-right`}>
          {item.time}
        </div>
        <h3 className="text-sm font-bold text-gray-600 leading-relaxed">
          {item.title}
        </h3>
      </div>

      <button
        onClick={(e) => {
          e.stopPropagation();
          const url =
            item.mapLink ||
            `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.location)}`;
          window.open(url, '_blank');
        }}
        className="p-1.5 rounded-full bg-white text-gray-400 hover:text-[#C78F76] transition-colors flex-shrink-0 border border-gray-200"
      >
        <div className="w-3.5 h-3.5 flex items-center justify-center rounded-tr-[50%] rounded-tl-[50%] rounded-bl-[50%] rounded-br-0 transform rotate-45 border-2 border-current">
          <div className="w-0.5 h-0.5 bg-current rounded-full transform -rotate-45" />
        </div>
      </button>
    </div>
  );
}
                                            return (
                                                <div
                                                    key={item.id}
                                                    onClick={() => setViewingItem(item)}
                                                    className="group bg-white rounded-xl p-4 shadow-[0_2px_8px_-2px_rgba(0,0,0,0.05)] border border-gray-50 hover:shadow-lg transition-all duration-300 cursor-pointer relative overflow-hidden"
                                                >
                                                    <div className="flex items-start gap-4">
    <div className="flex-shrink-0 w-14 flex flex-col items-end pt-1">
        <div className={`text-sm font-bold font-serif ${MORANDI_COLORS.highlight}`}>
            {item.time}
        </div>

        <div className="mt-2.5 w-7 h-7 rounded-full bg-[#FDFCF8] text-[#8F9E9D] flex items-center justify-center border border-gray-100 shadow-sm">
            <Icon name={item.iconName || "MapPin"} size={14} />
        </div>
    </div>

    <div className="flex-1 min-w-0">
                                                            <div className="flex justify-between items-start mb-0.5">
                                                                <h3 className={`text-lg font-bold ${MORANDI_COLORS.text} leading-tight`}>
                                                                    {item.title}
                                                                </h3>

                                                                <button
                                                                    onClick={(e) => {
                                                                        e.stopPropagation();
                                                                        const url = item.mapLink || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.location)}`;
                                                                        window.open(url, '_blank');
                                                                    }}
                                                                    className={`ml-2 p-1.5 rounded-full ${MORANDI_COLORS.bg} text-gray-400 hover:text-[#C78F76] hover:bg-[#FFF] transition-colors flex-shrink-0`}
                                                                >
                                                                    <div className="w-4 h-4 flex items-center justify-center rounded-tr-[50%] rounded-tl-[50%] rounded-bl-[50%] rounded-br-0 transform rotate-45 border-2 border-current">
                                                                        <div className="w-1 h-1 bg-current rounded-full transform -rotate-45" />
                                                                    </div>
                                                                </button>
                                                            </div>

                                                            <p className="text-sm text-gray-500 leading-relaxed line-clamp-2">
                                                                {item.subtitle || item.location}
                                                            </p>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}

                                        <div className="h-10 text-center text-xs text-gray-300 pt-4 leading-relaxed">
                                            Day {currentDate.dayNum} 行程結束
                                        </div>
                                    </div>
                                </div>
                            </React.Fragment>
                        ) : (
                            <div className="flex-1 overflow-y-auto pb-4 mb-24">
                                <InfoPage />
                            </div>
                        )}

                        <div className="absolute bottom-6 left-6 right-6 z-20">
                            <div className="bg-white/90 backdrop-blur-md rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.08)] p-1.5 flex justify-between border border-white/50">
                                <button
                                    onClick={() => setActiveTab('itinerary')}
                                    className={`flex-1 py-3 rounded-full flex items-center justify-center gap-2 text-sm font-medium transition-all duration-300 ${
                                        activeTab === 'itinerary'
                                            ? `${MORANDI_COLORS.primary} text-white shadow-md`
                                            : 'text-gray-400 hover:bg-gray-50'
                                    }`}
                                >
                                    <Icon name="Calendar" size={18} />
                                    每日行程
                                </button>
                                <button
                                    onClick={() => setActiveTab('info')}
                                    className={`flex-1 py-3 rounded-full flex items-center justify-center gap-2 text-sm font-medium transition-all duration-300 ${
                                        activeTab === 'info'
                                            ? `${MORANDI_COLORS.primary} text-white shadow-md`
                                            : 'text-gray-400 hover:bg-gray-50'
                                    }`}
                                >
                                    <Icon name="Info" size={18} />
                                    旅遊資訊
                                </button>
                            </div>
                        </div>

                        <DetailView item={viewingItem} onClose={() => setViewingItem(null)} />

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
